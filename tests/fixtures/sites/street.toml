# Two made-up households: one with PV sharing with a collective operation, one receiving.
[sites.sunny]
pack = "fr-household"

[sites.sunny.contract]
subscribed_kva = 9
off_peak = "22:00-06:00"
fields = { fta = "CU4", supply_option = "hp-hc", status = "collective" }

[[sites.sunny.assets]]
id = "house"
kind = "consumer"
profile = { source = "synthetic", key = "household", annual_kwh = 3000 }

[[sites.sunny.assets]]
id = "roof"
kind = "pv"
profile = { source = "synthetic", key = "pv-clear-sky", peak_kwp = 6, yield_kwh_per_kwp = 1100 }

[sites.flat]
pack = "fr-household"

[sites.flat.contract]
subscribed_kva = 6
fields = { fta = "LU", supply_option = "base" }

[[sites.flat.assets]]
id = "flat"
kind = "consumer"
profile = { source = "synthetic", key = "household", annual_kwh = 2000, time_shift_minutes = 60 }
