# Required checks for main (09-ci-cd). Every local hook stage is rerun here (HK-5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_LOCKED: "1" # every uv command fails if uv.lock is stale (CI-2)
  FORCE_COLOR: "1"

jobs:
  pre-commit-stage:
    name: hooks · pre-commit stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure
        env:
          SKIP: gitleaks # the secrets job scans the full history instead

  pre-push-stage:
    name: hooks · pre-push stage (tests, 100 % coverage, docs, contracts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
        env:
          STANDARDS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  commits:
    name: commits, PR title, branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run standards check-commits --range "origin/${BASE_REF}..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: uv run standards check-pr-title "${PR_TITLE}"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: uv run standards check-branch-name --name "${HEAD_REF}"
        env:
          HEAD_REF: ${{ github.head_ref }}

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "${PWD}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pip-audit --skip-editable --progress-spinner off

  badges:
    name: publish measured badges
    needs: [pre-push-stage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the badges branch only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Measure (from the gates' own reports)
        run: |
          uv run interrogate --fail-under 0 --ignore-private --ignore-semiprivate --ignore-magic --ignore-nested-functions src > interrogate.txt || true
          uv run standards badge coverage coverage.xml --out badges/coverage.json
          uv run standards badge docstrings interrogate.txt --out badges/docstrings.json
      - run: bash .github/scripts/publish-badges.sh badges
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: release (tag, build, SBOM, GitHub Release)
    needs: [pre-commit-stage, pre-push-stage, secrets, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the tag, create the release
      id-token: write # build provenance
      attestations: write
      issues: read # release blockers (CI-7)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - name: Refuse to release while a release-blocker issue is open (CI-7)
        run: |
          open=$(gh issue list --label release-blocker --state open --json number --jq length)
          if [ "${open}" != "0" ]; then
            echo "::error::${open} open release-blocker issue(s); fix them first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compute the next version from commits
        id: next
        run: |
          set +e
          next=$(uv run cz bump --get-next --yes 2>/dev/null)
          status=$?
          set -e
          if [ "${status}" = "0" ]; then
            echo "version=${next}" >> "${GITHUB_OUTPUT}"
          elif [ "${status}" = "21" ] || [ "${status}" = "3" ]; then
            echo "No releasable commit since the last tag."
          else
            echo "::error::cz bump --get-next failed (${status})"; exit "${status}"
          fi
      - name: Tag and push
        if: steps.next.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Build, SBOM, release notes
        if: steps.next.outputs.version
        run: |
          uv build
          uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uv run cyclonedx-py requirements requirements.txt --output-file dist/sbom.cdx.json
          uv run cz changelog "v${VERSION}" --dry-run > release-notes.md
        env:
          VERSION: ${{ steps.next.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.next.outputs.version
        with:
          subject-path: dist/*
      - name: GitHub Release
        if: steps.next.outputs.version
        run: gh release create "v${VERSION}" dist/* --title "v${VERSION}" --notes-file release-notes.md --verify-tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Every releasable commit is tagged and published (VER-2)
        run: |
          git fetch --tags --quiet origin
          uv run standards check-version --remote origin --released

  pages:
    name: publish and verify docs
    needs: [pre-commit-stage, pre-push-stage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run mkdocs build --strict
      - name: Mark the build, so the check below can prove what is served (DOC-11)
        run: |
          printf '{"commit": "%s"}\n' "${GITHUB_SHA}" > site/build.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the deployed site serves every page of this build (DOC-11)
        run: |
          for attempt in $(seq 1 20); do
            if uv run standards check-site "${SITE_URL}" --commit "${GITHUB_SHA}"; then exit 0; fi
            echo "attempt ${attempt}/20: waiting for the CDN"; sleep 15
          done
          exit 1
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
