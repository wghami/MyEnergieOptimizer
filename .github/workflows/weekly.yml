# Weekly hygiene: dependency audit, external links, standards drift (STD-2, DOC-5, SEC-11).
name: Weekly

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pip-audit --skip-editable --progress-spinner off

  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "${PWD}:/input" -w /input
          lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
          --no-progress --exclude-path site --exclude-path .venv "./**/*.md"

  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run standards check-template-drift

  report:
    needs: [audit, links, drift]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          title="Weekly hygiene failed"
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${title} in:title" --json number --jq '.[0].number')
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --label maintenance --body "${body}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
