# Slow gates (TST-11, TST-12). A scheduled failure opens a release-blocker issue (CI-7).
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  mutation:
    name: mutation score ≥ 90 %
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the mutation badge to the badges branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - name: Run mutmut (the score below is the gate)
        run: |
          set +e
          uv run mutmut run --max-children 4 2>&1 | tee mutmut.log
          set -e
          uv run mutmut export-cicd-stats
          if [ ! -f mutants/mutmut-cicd-stats.json ]; then
            if grep -q "could not find any test case for any mutant" mutmut.log; then
              # With 100 % coverage this only happens when there is no function to mutate yet.
              mkdir -p mutants && echo '{"total": 0}' > mutants/mutmut-cicd-stats.json
            else
              echo "::error::mutmut produced no statistics; see its output above"
              exit 1
            fi
          fi
      - name: Publish the measured score, pass or fail (CI-10)
        if: github.event_name != 'pull_request'
        run: |
          uv run standards badge mutation mutants/mutmut-cicd-stats.json --out badges/mutation.json
          bash .github/scripts/publish-badges.sh badges
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run standards check-mutation-score mutants/mutmut-cicd-stats.json --min 90

  perf:
    name: performance budgets
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - name: Run the performance budgets (none yet is a pass)
        run: |
          if [ ! -d tests/perf ]; then echo "No performance budgets yet (TST-11)."; exit 0; fi
          set +e
          uv run pytest tests/perf -m perf -p no:randomly --benchmark-only
          status=$?
          if [ "${status}" = "5" ]; then exit 0; fi
          exit "${status}"

  report:
    name: open a release blocker on failure
    needs: [mutation, perf]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          title="Nightly gate failed"
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label release-blocker --state open --search "${title} in:title" --json number --jq '.[0].number')
          body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --label release-blocker --body "${body}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
