[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "myenergyoptimizer"
dynamic = ["version"] # from git tags (VER-1)
description = "Simulate a home or energy-community electricity system whose dispatch is decided by user-written logic rules, built on SmartMDAO."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WGhami" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3",
    "pyarrow>=21",
]

[project.urls]
Repository = "https://github.com/wghami/MyEnergyOptimizer"
Documentation = "https://wghami.github.io/MyEnergyOptimizer/"

[dependency-groups]
dev = [
    "project-standards",
    "actionlint-py>=1.7.12",
    "bandit>=1.9.4",
    "commitizen>=4.19.3",
    "cyclonedx-bom>=7.5.0",
    "hypothesis>=6.170.9",
    "import-linter>=2.15",
    "ipykernel>=7.4.0",
    "interrogate>=1.7.0",
    "mutmut>=3.8.0",
    "nbmake>=1.5.5",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-markdown-docs>=0.9.2",
    "pytest-randomly>=5.0.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.2",
    "syrupy>=6.1.1",
    "zizmor>=1.31.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "matplotlib>=3.10",
]
docs = ["mkdocs-jupyter>=0.27.0", "mkdocs-material>=9.8.0", "mkdocstrings-python>=2.0.10"]

[tool.uv]
default-groups = ["dev", "docs"]
# Rebuild the editable install when a tag moves, so __version__ follows the tag (VER-1).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
project-standards = { git = "https://github.com/wghami/python-project-standards", rev = "164479149d6600e747932831fcbc2b51f9b5e435" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/myenergy"]

# --- Versioning (02-commits-and-versioning) -------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = false

# --- Lint & format (03-code-quality) ------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src"] # tools and scripts are first-party packages at the root

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # licence is declared once in LICENSE, not per file
    "D203",   # incompatible with D211 (no blank line before class docstring)
    "D213",   # incompatible with D212 (summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest uses assert
    "PLR2004", # literal expected values are the point of a test
    "D101", "D102", "D103", # test names state the behaviour; module docstring still required
    "INP001",  # pytest collects tests by path; test folders are not packages
]
"**/notebooks/**" = [
    "D100",   # a notebook's first markdown cell is its docstring (DOC-12)
    "T201",   # printing is how a notebook shows things
    "E402",   # imports come where the concept needs them
    "B018",   # a bare expression displays its value
    "INP001", # notebooks are not packages
    "S101",   # asserts state what the reader should see
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Inject a clock; never sleep (TW-5)."
"pickle".msg = "Unsafe deserialisation is forbidden (SEC-9)."

# --- Typing (03-code-quality) -------------------------------------------------------------
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests", "tools", "scripts"]
reportUnnecessaryTypeIgnoreComment = "error"

# --- Tests & coverage (05-testing) --------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "docs", "README.md"]
pythonpath = ["."] # tests import tools.* and scripts.* (LAY-5, DOC-13)
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--disable-socket",
    "--allow-unix-socket",
    "--markdown-docs",
]
markers = ["perf: performance budget (run nightly, excluded from the coverage run)"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["myenergy"]
source = ["tools", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
# The only allowed exclusions (COV-3). Changing this list requires an ADR.
exclude_also = ["if TYPE_CHECKING:", "@overload", "^\\s*\\.\\.\\.$", "assert_never\\("]

[tool.mutmut]
source_paths = ["src/myenergy/"]
also_copy = ["docs", "README.md", "mkdocs.yml", "tools", "scripts", "notebooks"]  # the tests read them

[tool.bandit]
exclude_dirs = ["tests"]
