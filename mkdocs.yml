site_name: MyEnergyOptimizer
site_description: Simulate a home or energy-community electricity system whose dispatch is decided by user-written logic rules, built on SmartMDAO.
site_url: https://wghami.github.io/MyEnergyOptimizer/
repo_url: https://github.com/wghami/MyEnergyOptimizer
strict: true
# Project standards pages are linked from standards/project/README.md, not listed in the nav,
# so projects never edit this template-managed file for them.
not_in_nav: |
  /standards/project/
  /notebooks/*.ipynb

theme:
  name: material
  features: [navigation.sections, navigation.top, search.suggest, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  - mkdocs-jupyter:
      execute: false # notebooks are committed executed (DOC-12); the hook re-runs them
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_submodules: true # the reference covers every module, not only __init__ (DOC-3)
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences

nav:
  - Home: index.md
  - Notebooks: notebooks/README.md
  - Scripts: scripts.md
  - Architecture:
      - architecture/time-and-series.md
      - architecture/profiles.md
      - architecture/rates.md
      - architecture/schedules.md
      - architecture/packs.md
      - architecture/sites-and-flows.md
      - architecture/price-books.md
      - architecture/wiring.md
  - Reference: reference.md
  - Standards:
      - standards/README.md
      - standards/01-repository-layout.md
      - standards/02-commits-and-versioning.md
      - standards/03-code-quality.md
      - standards/04-architecture.md
      - standards/05-testing.md
      - standards/06-documentation.md
      - standards/07-security.md
      - standards/08-git-hooks.md
      - standards/09-ci-cd.md
      - standards/10-definition-of-done.md
      - standards/11-keeping-standards-current.md
      - Project-specific: standards/project/README.md
